services:
  api:
    build:
      context: ./api
    ports:
      - "8765:8765"
    environment:
      DATABASE_URL: sqlite:////app/data/praxis_web.db
      FRONTEND_ORIGIN: http://localhost:3000
      BASES_CACHE_DIR: data/bases_cache
    volumes:
      - api_data:/app/data

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      API_PROXY_TARGET: http://api:8765
    depends_on:
      - api

volumes:
  api_data:
