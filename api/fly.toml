# Fly.io deployment for the PRAXIS Web API.
# Create app: fly launch --no-deploy --config WebApp/api/fly.toml
# Set secrets: fly secrets set DATABASE_URL=... FRONTEND_ORIGIN=...

app = "praxis-web-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 40

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

[mounts]
  source = "bases_cache"
  destination = "/app/data/bases_cache"

[env]
  BASES_CACHE_DIR = "data/bases_cache"
  OBJECT_STORAGE_BACKEND = "local"
  COOKIE_SECURE = "1"
